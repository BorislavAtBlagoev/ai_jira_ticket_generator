services:
  backend:
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}

  frontend:
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
